// ============================================================================
// Admin: Equipment Checkout — live view of what's out of the audio and video
// booths and who has it, fed by the booth iPads running
// equipment-checkout.html. Read-only here; the booths are the source of truth.
// ============================================================================
// ============================================================================
// ADV MEDIA — AISD BILLING ENGINE
// ============================================================================
// Turns a worked shift into billable hours and dollars, per the ADV Media
// Crew Rate & Break Policy.
//
// IMPORTANT: this is what ADV bills AISD. It is NOT what ADV pays crew.
// Those are separate numbers and must never be shown to the client.
// ============================================================================

// "postMealMin" is the guaranteed hours after a crew member is released for
// a meal. Only the 5-hour-minimum roles have one — stagehands get 3 hours,
// assistants get 5. Every 10-hour-minimum role is null: they bill 10 hours
// regardless of when lunch lands. (Meal PENALTY still applies to them if no
// meal is given by hour 5 — that is a separate rule.)
const RATE_CLASSES = {
  stagehand: {
    label: "Stagehand",
    rate: 40, minHours: 5, otAfter: 8, dtAfter: 12, postMealMin: 3,
    roles: ["Stagehand"],
  },
  spotlight: {
    label: "Spotlight Operator",
    rate: 40, minHours: 10, otAfter: 10, dtAfter: 12, postMealMin: null,
    roles: ["Spotlight Operator"],
  },
  assistant: {
    label: "Assistant",
    rate: 50, minHours: 5, otAfter: 8, dtAfter: 12, postMealMin: 5,
    roles: ["A2", "L2", "V2", "GAV", "General AV"],
  },
  coordinator: {
    label: "Coordinator",
    rate: 55, minHours: 10, otAfter: 10, dtAfter: 12, postMealMin: null,
    roles: ["Coordinator"],
  },
  lead: {
    label: "Lead",
    rate: 60, minHours: 10, otAfter: 10, dtAfter: 12, postMealMin: null,
    roles: ["L1", "A1", "V1", "Engineer", "Stage Manager", "GFX", "PowerPoint", "Teleprompter"],
    // Note: "Director" intentionally lives in the senior class, not here.
  },
  senior: {
    label: "Senior / Management",
    rate: 75, minHours: 10, otAfter: 10, dtAfter: 12, postMealMin: null,
    roles: ["ME", "EIC", "Project Manager", "Producer", "Director"],
  },
};

// Flat role -> class lookup, built from the table above.
const ROLE_TO_CLASS = {};
Object.entries(RATE_CLASSES).forEach(([classId, def]) => {
  def.roles.forEach((r) => { ROLE_TO_CLASS[r.toLowerCase()] = classId; });
});

function classForRole(role) {
  return ROLE_TO_CLASS[String(role || "").toLowerCase()] || null;
}

// ---------------------------------------------------------------------------
// ASSUMPTIONS — flagged for review. Change these if any are wrong.
// ---------------------------------------------------------------------------
// A1. Multipliers do NOT stack. If an hour qualifies for more than one
//     premium (e.g. night differential AND overtime), it bills at the
//     HIGHEST single multiplier, not the product.
//
// A2. Minimum-call guarantee hours bill at STRAIGHT time. A stagehand who
//     works 2 hours bills 5 x 1.0.
//
// A3. Post-meal guarantee applies ONLY to the 5-hour-minimum roles:
//     stagehands 3 hours, assistants 5 hours, measured from when the meal
//     ENDS. Every 10-hour-minimum role bills 10 hours regardless of when
//     lunch happens, so no post-meal floor applies to them.
//
// A4. Meal penalty (no meal by hour 5) bills those hours at 1.5x, and stops
//     once the meal starts.
//
// A5. SCHEDULED overtime is billed even if not worked. When a shift is
//     scheduled long enough to include OT, those hours were already
//     committed to the contractor and can't be clawed back, so the client
//     is billed for them at their OT rate. Unscheduled overtime is
//     billed on hours actually worked. Pass `scheduledHours` to use this.
//
// A6. Scheduled hours that were NOT actually worked cap at time and a half.
//     Booked-but-not-worked time never reaches double time, even if the
//     scheduled shift ran past the 12-hour DT threshold.
// ---------------------------------------------------------------------------

const MULT = { straight: 1, ot: 1.5, dt: 2 };

// Is this clock-hour inside the 12:00am-6:00am night window?
function isNightHour(date) {
  const h = date.getHours();
  return h >= 0 && h < 6;
}

/**
 * Calculate what AISD gets billed for one worked shift.
 *
 * @param {Object} shift
 * @param {string} shift.role             e.g. "A1", "Stagehand"
 * @param {string} shift.clockIn          ISO timestamp
 * @param {string} shift.clockOut         ISO timestamp
 * @param {string} [shift.mealStart]      ISO timestamp, if a meal was given
 * @param {string} [shift.mealEnd]        ISO timestamp
 * @param {number} [shift.scheduledHours] hours the crew member was booked
 *                                        for. If this runs into overtime,
 *                                        the client is billed for it even
 *                                        if the shift ended early.
 * @returns {Object} breakdown
 */
function calculateShiftBilling(shift) {
  const classId = classForRole(shift.role);
  if (!classId) {
    return { error: `No rate class defined for role "${shift.role}".` };
  }
  const def = RATE_CLASSES[classId];

  const start = new Date(shift.clockIn);
  const end = new Date(shift.clockOut);
  if (isNaN(start) || isNaN(end) || end <= start) {
    return { error: "Clock in/out times are missing or out of order." };
  }

  const workedHours = (end - start) / 36e5;
  const scheduledHours = Number(shift.scheduledHours) > 0 ? Number(shift.scheduledHours) : 0;
  const mealStart = shift.mealStart ? new Date(shift.mealStart) : null;
  const mealEnd = shift.mealEnd ? new Date(shift.mealEnd) : null;
  const hadMeal = !!(mealStart && !isNaN(mealStart));

  const mealStartAt = hadMeal ? (mealStart - start) / 36e5 : null;
  const mealEndAt = (mealEnd && !isNaN(mealEnd)) ? (mealEnd - start) / 36e5 : mealStartAt;

  // ---- Step 1: hours eligible for premium rates ----
  // Hours actually worked, plus any scheduled hours the crew member was
  // booked for. Scheduled hours carry their OT/DT multiplier (A5) because
  // that time was already promised to the contractor.
  const premiumHours = Math.max(workedHours, scheduledHours);

  // ---- Step 2: total billed hours, after floors ----
  let billedHours = premiumHours;

  // A3: post-meal guarantee — only for roles that have one.
  if (hadMeal && mealEndAt != null && def.postMealMin) {
    billedHours = Math.max(billedHours, mealEndAt + def.postMealMin);
  }

  // Minimum call.
  billedHours = Math.max(billedHours, def.minHours);

  // ---- Step 3: bucket premium-eligible hours by multiplier ----
  const SLICE = 0.25;
  const buckets = { straight: 0, ot: 0, dt: 0 };
  const premiumCap = Math.min(premiumHours, billedHours);

  for (let t = 0; t < premiumCap - 1e-9; t += SLICE) {
    const sliceLen = Math.min(SLICE, premiumCap - t);
    const at = new Date(start.getTime() + t * 36e5);
    const elapsed = t;

    let mult = MULT.straight;

    if (elapsed >= def.dtAfter) mult = Math.max(mult, MULT.dt);
    else if (elapsed >= def.otAfter) mult = Math.max(mult, MULT.ot);

    if (isNightHour(at)) mult = Math.max(mult, MULT.ot);

    // A4: meal penalty — past hour 5 with no meal yet. Only applies to
    // time actually worked; you can't incur a meal penalty on a shift
    // that already ended.
    const withinWorked = elapsed < workedHours;
    const mealNotYetTaken = !hadMeal || (mealStartAt != null && elapsed < mealStartAt);
    if (withinWorked && elapsed >= 5 && mealNotYetTaken) mult = Math.max(mult, MULT.ot);

    // A6: scheduled hours that were NOT actually worked cap at time and a
    // half. The crew member was owed the booked time, but they didn't work
    // it, so it never reaches double time.
    if (!withinWorked) mult = Math.min(mult, MULT.ot);

    if (mult === MULT.dt) buckets.dt += sliceLen;
    else if (mult === MULT.ot) buckets.ot += sliceLen;
    else buckets.straight += sliceLen;
  }

  // A2: pure minimum-call guarantee bills at straight time.
  const guaranteeHours = Math.max(0, billedHours - premiumCap);
  buckets.straight += guaranteeHours;

  const amount =
    buckets.straight * def.rate * MULT.straight +
    buckets.ot * def.rate * MULT.ot +
    buckets.dt * def.rate * MULT.dt;

  const round2 = (n) => Math.round(n * 100) / 100;

  return {
    role: shift.role,
    rateClass: def.label,
    rate: def.rate,
    workedHours: round2(workedHours),
    scheduledHours: round2(scheduledHours),
    billedHours: round2(billedHours),
    minimumApplied: billedHours > workedHours,
    scheduledOtBilled: scheduledHours > workedHours && scheduledHours > def.otAfter,
    guaranteeHours: round2(guaranteeHours),
    hadMeal,
    straightHours: round2(buckets.straight),
    otHours: round2(buckets.ot),
    dtHours: round2(buckets.dt),
    amount: round2(amount),
  };
}

/** Roll several shifts into one AISD invoice. */
function buildInvoice(shifts, meta) {
  const lines = [];
  const errors = [];
  shifts.forEach((s) => {
    const r = calculateShiftBilling(s);
    if (r.error) errors.push({ shift: s, error: r.error });
    else lines.push({ ...r, personName: s.personName, date: s.clockIn });
  });
  const subtotal = lines.reduce((sum, l) => sum + l.amount, 0);
  return {
    ...(meta || {}),
    lines, errors,
    subtotal: Math.round(subtotal * 100) / 100,
    terms: "Net 30",
  };
}

// ============================================================================
// Admin: AISD Invoices — rolls completed shifts for an event through the
// billing engine into one combined invoice for the client.
//
// This is what ADV bills AISD. It is NOT what ADV pays crew — those numbers
// live in Crew Invoices and must never be shown to the client.
// ============================================================================
async function renderAisdInvoices() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading…</div>`;
  try {
    const [evSnap, rosterSnap, clockSnap] = await Promise.all([
      db.ref("clientEvents").once("value"),
      db.ref("liveRoster").once("value"),
      db.ref("clockArchive").once("value"),
    ]);
    const events = evSnap.val() || {};
    const roster = rosterSnap.val() || {};
    const clock = clockSnap.val() || {};

    const ids = Object.keys(events).sort().reverse();
    if (ids.length === 0) {
      inner.innerHTML = `<div class="footnote">No client events yet. Schedule a labor request first.</div>`;
      return;
    }

    const money = (n) => "$" + n.toFixed(2);

    inner.innerHTML = ids.map((eventId) => {
      const ev = events[eventId] || {};
      const slots = roster[eventId] || {};
      const clockForEvent = clock[eventId] || {};

      // Match each filled slot to its clock in/out record.
      const shifts = [];
      const unclocked = [];
      Object.entries(slots).forEach(([roleKey, slot]) => {
        if (!slot || slot.status !== "assigned" || !slot.name) return;
        const rec = Object.values(clockForEvent).find(
          (c) => c && c.name && namesMatch(slot.name, c.name)
        );
        if (rec && rec.clockInAt && rec.clockOutAt) {
          shifts.push({
            personName: slot.name,
            role: slot.billingRole || slot.role,
            displayRole: slot.role,
            clockIn: rec.clockInAt,
            clockOut: rec.clockOutAt,
            mealStart: rec.mealStart || null,
            mealEnd: rec.mealEnd || null,
            scheduledHours: slot.scheduledHours || ev.scheduledHours || 0,
          });
        } else {
          unclocked.push({ name: slot.name, role: slot.role });
        }
      });

      const invoice = buildInvoice(shifts, { eventName: ev.name, eventDate: ev.eventDate });

      return `
        <div class="shift-game-card">
          <div class="shift-game-header">
            ${escapeHtml(ev.name || "Event")}
            <span style="background:var(--blue); color:#fff; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:6px; margin-left:8px; vertical-align:middle;">${escapeHtml(ev.client || "AISD")}</span>
          </div>
          <div class="log-reason" style="margin-bottom:10px;">
            ${escapeHtml(ev.date || ev.eventDate || "")}${ev.venue ? " · " + escapeHtml(ev.venue) : ""}
          </div>

          ${unclocked.length ? `
            <div class="setup-warning" style="display:block; margin-bottom:10px;">
              ⚠️ ${unclocked.length} assigned shift${unclocked.length === 1 ? "" : "s"} with no clock-in/out yet — not billed:
              ${unclocked.map((u) => escapeHtml(u.name + " (" + u.role + ")")).join(", ")}
            </div>
          ` : ""}

          ${invoice.errors.length ? `
            <div class="error-msg" style="margin-top:0; margin-bottom:10px;">
              ${invoice.errors.length} shift${invoice.errors.length === 1 ? "" : "s"} couldn't be priced: ${invoice.errors.map((e) => escapeHtml(e.error)).join("; ")}
            </div>
          ` : ""}

          ${invoice.lines.length === 0
            ? `<div class="footnote">Nothing billable yet — crew need to clock in and out.</div>`
            : `
              ${invoice.lines.map((l) => `
                <div class="log-entry">
                  <div class="log-entry-top">
                    <span class="log-badge" style="background:var(--panel2); color:var(--text-muted);">${escapeHtml(l.rateClass)}</span>
                    <span class="log-when">${money(l.amount)}</span>
                  </div>
                  <div class="log-entry-body"><strong>${escapeHtml(l.personName)}</strong> · ${escapeHtml(l.role)} @ ${money(l.rate)}/hr</div>
                  <div class="log-reason">
                    worked ${l.workedHours}h → billed ${l.billedHours}h${l.minimumApplied ? " (minimum)" : ""}${l.scheduledOtBilled ? " (booked OT)" : ""}
                    · ${[
                      l.straightHours ? l.straightHours + "h straight" : "",
                      l.otHours ? l.otHours + "h OT" : "",
                      l.dtHours ? l.dtHours + "h DT" : "",
                    ].filter(Boolean).join(" + ")}
                    ${l.hadMeal ? "" : " · no meal recorded"}
                  </div>
                </div>
              `).join("")}
              <div class="shift-row" style="margin-top:10px; border-top:1px solid var(--border); padding-top:12px;">
                <div class="shift-role" style="font-size:15px;">Invoice total</div>
                <div class="shift-status" style="font-size:17px; font-weight:800; color:var(--green);">${money(invoice.subtotal)}</div>
              </div>
              <div class="log-reason" style="margin-top:6px;">Terms: ${escapeHtml(invoice.terms)}</div>
              <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                <button class="shift-btn shift-btn-pickup" data-copy="${escapeAttr(eventId)}">Copy Invoice Text</button>
                <button class="shift-btn" data-release="${escapeAttr(eventId)}" style="background:var(--panel2); border:1px solid var(--green); color:var(--green);">
                  ${ev.invoiceReleased ? "Update Client Invoice" : "Send Invoice to Client"}
                </button>
              </div>
              ${ev.invoiceReleased ? `<div class="log-reason" style="margin-top:8px; color:var(--green);">✓ Visible to the client in their portal since ${new Date(ev.invoiceReleased).toLocaleDateString()}</div>` : ""}
            `}
        </div>
      `;
    }).join("");

    // Publish a client-safe copy of the invoice to their portal. Deliberately
    // omits crew names and anything about what ADV pays its contractors —
    // the client sees rate classes, hours, and totals only.
    inner.querySelectorAll("[data-release]").forEach((btn) => {
      btn.onclick = async () => {
        const eventId = btn.dataset.release;
        const ev = events[eventId] || {};
        if (!ev.fromRequest) {
          alert("This event isn't linked to a client request, so there's nowhere to publish it.");
          return;
        }
        const slots = roster[eventId] || {};
        const clockForEvent = clock[eventId] || {};
        const shifts = [];
        Object.entries(slots).forEach(([, slot]) => {
          if (!slot || slot.status !== "assigned" || !slot.name) return;
          const rec = Object.values(clockForEvent).find((c) => c && c.name && namesMatch(slot.name, c.name));
          if (rec && rec.clockInAt && rec.clockOutAt) {
            shifts.push({
              personName: slot.name, role: slot.billingRole || slot.role,
              clockIn: rec.clockInAt, clockOut: rec.clockOutAt,
              mealStart: rec.mealStart || null, mealEnd: rec.mealEnd || null,
              scheduledHours: slot.scheduledHours || ev.scheduledHours || 0,
            });
          }
        });
        const inv = buildInvoice(shifts, {});
        if (inv.lines.length === 0) {
          alert("Nothing billable yet — crew need to clock in and out first.");
          return;
        }
        if (!confirm(`Publish this invoice to the client's portal?\n\nTotal: $${inv.subtotal.toFixed(2)}\n\nThey'll see rate classes, hours, and totals — no crew names.`)) return;

        const clientLines = inv.lines.map((l) => ({
          rateClass: l.rateClass,
          billedHours: l.billedHours,
          rate: l.rate,
          amount: l.amount,
          detail: [l.straightHours ? l.straightHours + "h ST" : "",
                   l.otHours ? l.otHours + "h OT" : "",
                   l.dtHours ? l.dtHours + "h DT" : ""].filter(Boolean).join(", "),
        }));
        try {
          const issuedAt = new Date().toISOString();
          await db.ref(`laborRequests/${ev.fromRequest}`).update({
            status: "completed",
            clientInvoice: { lines: clientLines, total: inv.subtotal, terms: inv.terms, issuedAt },
          });
          await db.ref(`clientEvents/${eventId}/invoiceReleased`).set(issuedAt);
          alert("Sent — the client can see it in their portal now.");
          renderAisdInvoices();
        } catch (e) {
          alert("Couldn't publish that: " + (e.message || "unknown error"));
        }
      };
    });

    // Plain-text invoice for pasting into an email or accounting system.
    inner.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.onclick = () => {
        const eventId = btn.dataset.copy;
        const ev = events[eventId] || {};
        const slots = roster[eventId] || {};
        const clockForEvent = clock[eventId] || {};
        const shifts = [];
        Object.entries(slots).forEach(([, slot]) => {
          if (!slot || slot.status !== "assigned" || !slot.name) return;
          const rec = Object.values(clockForEvent).find((c) => c && c.name && namesMatch(slot.name, c.name));
          if (rec && rec.clockInAt && rec.clockOutAt) {
            shifts.push({
              personName: slot.name, role: slot.billingRole || slot.role,
              clockIn: rec.clockInAt, clockOut: rec.clockOutAt,
              mealStart: rec.mealStart || null, mealEnd: rec.mealEnd || null,
              scheduledHours: slot.scheduledHours || ev.scheduledHours || 0,
            });
          }
        });
        const inv = buildInvoice(shifts, {});
        const lines = [
          `ADV MEDIA LIMITED COMPANY`,
          `INVOICE — ${ev.client || "AISD"}`,
          ``,
          `Event: ${ev.name || ""}`,
          `Date: ${ev.eventDate || ev.date || ""}`,
          ev.venue ? `Venue: ${ev.venue}` : ``,
          ``,
          `LABOR`,
          ...inv.lines.map((l) =>
            `  ${l.rateClass} — ${l.billedHours}h @ $${l.rate}/hr` +
            (l.otHours || l.dtHours ? ` (${[l.straightHours ? l.straightHours + "h ST" : "", l.otHours ? l.otHours + "h OT" : "", l.dtHours ? l.dtHours + "h DT" : ""].filter(Boolean).join(", ")})` : ``) +
            ` .......... $${l.amount.toFixed(2)}`
          ),
          ``,
          `TOTAL DUE: $${inv.subtotal.toFixed(2)}`,
          `Terms: ${inv.terms}`,
        ].filter((l) => l !== ``|| true);
        const text = lines.join("\n");
        navigator.clipboard.writeText(text).then(
          () => alert("Invoice copied — paste it into an email or your accounting system.\n\nNote: crew names are left off the client copy."),
          () => prompt("Copy this:", text)
        );
      };
    });
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't build invoices (${escapeHtml(e.message || "unknown error")}).</div>`;
  }
}

// ============================================================================
// Admin: Labor Requests — incoming crew requests from clients (AISD), sent
// from aisd-request.html. Approving one turns it into a real event on the
// shift board with open slots the crew can pick up.
// ============================================================================

// Maps the position IDs the client picks from to the internal role names the
// billing engine and shift board use.
const REQUEST_POSITION_ROLES = {
  stagehand:   "Stagehand",
  spotlight:   "Spotlight Operator",
  gav:         "GAV",
  coordinator: "Coordinator",
  lead:        "A1",
  graphics:    "GFX",
  senior:      "Producer",
};

async function renderLaborRequests() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading…</div>`;
  try {
    const snap = await db.ref("laborRequests").once("value");
    const byUid = snap.val() || {};
    // Stored as laborRequests/{submitterUid}/{pushKey} so clients can read
    // their own back. Flatten it here, keeping the full path on each entry.
    const all = {};
    const entries = [];
    Object.entries(byUid).forEach(([uid, val]) => {
      if (!val || typeof val !== "object") return;
      // Requests submitted before the per-user restructure sit flat at
      // laborRequests/{key}. Detect those by the fields a request always
      // has, and read them at their original path.
      if (val.eventName || val.submittedAt || val.positions) {
        all[uid] = val;
        entries.push({ key: uid, ...val });
        return;
      }
      Object.entries(val).forEach(([k, r]) => {
        if (!r || typeof r !== "object") return;
        const path = `${uid}/${k}`;
        all[path] = r;
        entries.push({ key: path, ...r });
      });
    });
    entries.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    if (entries.length === 0) {
      inner.innerHTML = `<div class="footnote">No labor requests yet. They'll show up here when a client submits one.</div>`;
      return;
    }

    const open = entries.filter((r) => r.status !== "scheduled" && r.status !== "declined");
    const closed = entries.filter((r) => r.status === "scheduled" || r.status === "declined");

    const fmtDate = (d) => {
      if (!d) return "";
      const dt = new Date(d + "T12:00:00");
      return isNaN(dt) ? d : dt.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    };

    const card = (r) => {
      const badge = r.status === "scheduled" ? { t: "Scheduled", c: "var(--green)" }
        : r.status === "declined" ? { t: "Declined", c: "var(--red)" }
        : { t: "New", c: "var(--amber)" };
      return `
        <div class="shift-game-card">
          <div class="shift-game-header">
            ${escapeHtml(r.eventName || "Untitled event")}
            <span style="background:${badge.c}; color:#08120C; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:6px; margin-left:8px; vertical-align:middle;">${badge.t}</span>
          </div>
          <div class="log-reason" style="margin-bottom:8px;">
            ${escapeHtml(r.client || "Client")} · ${fmtDate(r.eventDate)}${r.callTime ? " · call " + escapeHtml(r.callTime) : ""}${r.endTime ? "–" + escapeHtml(r.endTime) : ""}
            ${r.venue ? "<br />" + escapeHtml(r.venue) : ""}
          </div>
          ${(r.positions || []).map((p) => `
            <div class="shift-row">
              <div class="shift-role">${escapeHtml(p.name)}</div>
              <div class="shift-status">${p.qty} requested</div>
            </div>
          `).join("")}
          ${r.notes ? `<div class="log-reason" style="margin-top:8px;"><strong>Notes:</strong> ${escapeHtml(r.notes)}</div>` : ""}
          <div class="log-reason" style="margin-top:8px; color:var(--text-faint);">
            ${escapeHtml(r.contactName || "")}${r.contactEmail ? " · " + escapeHtml(r.contactEmail) : ""}${r.contactPhone ? " · " + escapeHtml(r.contactPhone) : ""}
            <br />Submitted ${new Date(r.submittedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} via ${escapeHtml(r.submittedVia || "google")}
          </div>
          ${r.status !== "scheduled" && r.status !== "declined" ? `
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="shift-btn shift-btn-pickup" data-approve="${escapeAttr(r.key)}">Schedule It</button>
              <button class="shift-btn" data-decline="${escapeAttr(r.key)}" style="background:var(--panel2); border:1px solid var(--red); color:var(--red);">Decline</button>
            </div>
          ` : r.status === "scheduled" ? `
            <div class="log-reason" style="margin-top:10px; color:var(--green);">✓ On the shift board — crew can pick these up.</div>
            <button class="shift-btn" data-unschedule="${escapeAttr(r.key)}" style="margin-top:10px; background:var(--panel2); border:1px solid var(--red); color:var(--red);">Remove from Board</button>
          ` : ""}
        </div>
      `;
    };

    inner.innerHTML = `
      ${open.length ? `<div class="footnote" style="margin-bottom:10px;">${open.length} awaiting action</div>` : ""}
      ${open.map(card).join("")}
      ${closed.length ? `<div class="footnote" style="margin:22px 0 10px;">Handled</div>` : ""}
      ${closed.map(card).join("")}
    `;

    inner.querySelectorAll("[data-approve]").forEach((b) => {
      b.onclick = () => scheduleLaborRequest(b.dataset.approve, all[b.dataset.approve]);
    });
    // Undo a scheduling — deletes the event and its shift slots, and puts
    // the request back in the queue. Mainly for cleaning up test runs.
    inner.querySelectorAll("[data-unschedule]").forEach((b) => {
      b.onclick = async () => {
        const key = b.dataset.unschedule;
        const req = all[key];
        if (!req || !req.scheduledEventId) return;
        const eventId = req.scheduledEventId;
        if (!confirm(`Remove "${req.eventName || "this event"}" from the shift board?\n\nDeletes the event and all its shift slots, including any crew have already picked up. The request goes back to New.`)) return;
        try {
          await db.ref(`liveRoster/${eventId}`).remove();
          await db.ref(`clientEvents/${eventId}`).remove();
          await db.ref(`laborRequests/${key}`).update({
            status: "new", scheduledEventId: null, scheduledHours: null, scheduledAt: null,
          });
          renderLaborRequests();
        } catch (e) {
          alert("Couldn't remove that: " + (e.message || "unknown error"));
        }
      };
    });

    inner.querySelectorAll("[data-decline]").forEach((b) => {
      b.onclick = async () => {
        if (!confirm("Decline this request? The client isn't notified automatically — follow up with them directly.")) return;
        await db.ref(`laborRequests/${b.dataset.decline}/status`).set("declined");
        renderLaborRequests();
      };
    });
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't load labor requests (${escapeHtml(e.message || "unknown error")}). Make sure the database rules include a "laborRequests" section.</div>`;
  }
}

// Turn an approved request into a real event with open shift slots.
async function scheduleLaborRequest(key, req) {
  if (!req) return;

  // How long is each person booked for? This drives scheduled-overtime
  // billing later, so it's captured now rather than guessed at invoice time.
  const defaultHours = estimateScheduledHours(req);
  const entered = prompt(
    `How many hours is each crew member booked for?\n\n` +
    `This is what the client gets billed if the shift wraps early — booked overtime still bills.\n\n` +
    `Leave as-is to use the call-to-end window.`,
    String(defaultHours)
  );
  if (entered === null) return;
  const scheduledHours = Number(entered);
  if (!(scheduledHours > 0)) { alert("Enter a number of hours greater than zero."); return; }

  const eventId = `${req.eventDate}__${key.slice(-6)}`;
  const dt = req.eventDate ? new Date(req.eventDate + "T12:00:00") : null;

  // Build one roster slot per requested head, e.g. 3 stagehands becomes
  // Stagehand 1, Stagehand 2, Stagehand 3. The base role is kept separately
  // because the billing engine matches on "Stagehand", not "Stagehand 2".
  const roles = [];
  const billingRoles = {};
  (req.positions || []).forEach((p) => {
    const roleName = REQUEST_POSITION_ROLES[p.id] || p.name;
    for (let i = 1; i <= p.qty; i++) {
      const display = p.qty > 1 ? `${roleName} ${i}` : roleName;
      roles.push(display);
      billingRoles[display.replace(/[^A-Za-z0-9]/g, "_")] = roleName;
    }
  });

  try {
    await db.ref(`clientEvents/${eventId}`).set({
      name: req.eventName || "Event",
      client: req.client || "AISD",
      venue: req.venue || "",
      date: dt && !isNaN(dt) ? `${dt.getMonth() + 1}/${dt.getDate()}` : (req.eventDate || ""),
      day: dt && !isNaN(dt) ? dt.toLocaleDateString([], { weekday: "short" }) : "",
      eventDate: req.eventDate || "",
      callTime: req.callTime || "",
      endTime: req.endTime || "",
      scheduledHours,
      roles,
      billingRoles,
      fromRequest: key,
      createdAt: new Date().toISOString(),
    });

    // Open slots for everything requested.
    const rosterUpdates = {};
    roles.forEach((role) => {
      const roleKey = role.replace(/[^A-Za-z0-9]/g, "_");
      rosterUpdates[`liveRoster/${eventId}/${roleKey}`] = {
        role, name: null, status: "open",
        billingRole: billingRoles[roleKey] || role,
        scheduledHours,
      };
    });
    await db.ref().update(rosterUpdates);

    await db.ref(`laborRequests/${key}`).update({
      status: "scheduled",
      scheduledEventId: eventId,
      scheduledHours,
      scheduledAt: new Date().toISOString(),
    });

    alert(`Scheduled — ${roles.length} open shift${roles.length === 1 ? "" : "s"} added to the board.`);
    renderLaborRequests();
  } catch (e) {
    alert("Couldn't schedule that: " + (e.message || "unknown error"));
  }
}

// Best guess at booked hours from the call and end times on the request.
function estimateScheduledHours(req) {
  if (req.callTime && req.endTime) {
    const [sh, sm] = req.callTime.split(":").map(Number);
    const [eh, em] = req.endTime.split(":").map(Number);
    if (!isNaN(sh) && !isNaN(eh)) {
      let hrs = (eh + em / 60) - (sh + sm / 60);
      if (hrs < 0) hrs += 24; // ran past midnight
      if (hrs > 0) return Math.round(hrs * 4) / 4;
    }
  }
  return 10;
}

async function renderCheckoutAdmin() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading…</div>`;
  try {
    const [outSnap, logSnap] = await Promise.all([
      db.ref("equipmentCheckouts").once("value"),
      db.ref("equipmentLog").once("value"),
    ]);
    const byBooth = outSnap.val() || {};
    const logByBooth = logSnap.val() || {};

    const boothLabels = { audio: "Audio Booth", video: "Video Booth" };
    const boothKeys = ["audio", "video"];

    // Flatten the log so we can show one combined recent-activity list.
    const recent = [];
    boothKeys.forEach((b) => {
      Object.values(logByBooth[b] || {}).forEach((e) => recent.push(e));
    });
    recent.sort((a, b) => new Date(b.inAt || b.outAt) - new Date(a.inAt || a.outAt));

    const fmt = (iso) => {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    };
    const hoursOut = (iso) => {
      const d = new Date(iso);
      if (isNaN(d)) return 0;
      return (Date.now() - d.getTime()) / 36e5;
    };

    let html = "";
    boothKeys.forEach((booth) => {
      const items = Object.values(byBooth[booth] || {});
      items.sort((a, b) => new Date(a.outAt) - new Date(b.outAt));
      const overdue = items.filter((e) => hoursOut(e.outAt) > 24);
      html += `
        <div class="shift-game-card">
          <div class="shift-game-header">${boothLabels[booth]} — ${items.length} out</div>
          ${overdue.length ? `<div class="setup-warning" style="display:block; margin-bottom:10px;">⚠️ ${overdue.length} item${overdue.length === 1 ? "" : "s"} out more than 24 hours</div>` : ""}
          ${items.length === 0
            ? `<div class="footnote">Everything's checked in.</div>`
            : items.map((e) => `
                <div class="shift-row">
                  <div class="shift-role">${escapeHtml(e.itemName)} #${escapeHtml(String(e.unitNum))}</div>
                  <div class="shift-status ${hoursOut(e.outAt) > 24 ? "shift-open" : ""}">${escapeHtml(e.personName || "—")} · ${fmt(e.outAt)}</div>
                </div>
              `).join("")}
        </div>
      `;
    });

    html += `<div class="footnote" style="margin:18px 0 8px;">Recent activity</div>`;
    if (recent.length === 0) {
      html += `<div class="footnote">Nothing logged yet.</div>`;
    } else {
      html += recent.slice(0, 40).map((e) => {
        const isIn = e.action === "in";
        return `
          <div class="log-entry">
            <div class="log-entry-top">
              <span class="log-badge" style="background:${isIn ? "var(--green)" : "var(--amber)"};">${isIn ? "Returned" : "Out"}</span>
              <span class="log-when">${fmt(e.inAt || e.outAt)}</span>
            </div>
            <div class="log-entry-body"><strong>${escapeHtml(e.itemName)} #${escapeHtml(String(e.unitNum))}</strong> · ${escapeHtml(boothLabels[e.booth] || e.booth || "")}</div>
            <div class="log-reason">${isIn
              ? `Taken by ${escapeHtml(e.personName || "—")}, returned by ${escapeHtml(e.returnedBy || "—")}`
              : `Checked out to ${escapeHtml(e.personName || "—")}`}</div>
          </div>
        `;
      }).join("");
    }

    inner.innerHTML = html;
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't load checkout data (${escapeHtml(e.message || "unknown error")}). Make sure the database rules include "equipmentCheckouts" and "equipmentLog" — see the setup note at the top of equipment-checkout.html.</div>`;
  }
}

async function renderEquipmentReports() {

  try {
    const snap = await db.ref("equipmentReports").once("value");

  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't load equipment reports (${escapeHtml(e.message || "unknown error")}). Make sure the database rules include an "equipmentReports" section.</div>`;
  }
}

async function renderTodayView() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading…</div>`;

  const todayId = new Date().toISOString().slice(0, 10);
  const game = GAMES.find((g) => g.id === todayId);

  if (!game) {
    inner.innerHTML = `<div class="footnote">No game scheduled today.</div>`;
    return;
  }

  const positions = ROSTER_DATA[todayId] || {};
  const filled = Object.entries(positions).filter(([, name]) => name && name !== "TBD");

  inner.innerHTML = `
    <div class="shift-game-card">
      <div class="shift-game-header">${escapeHtml(game.day)} ${escapeHtml(game.date)} — ${escapeHtml(game.opp)}</div>
      <div id="todayWeather" class="footnote">Loading weather…</div>
    </div>
    <div class="footnote" style="margin:14px 0 8px;">Working today (${filled.length})</div>
    ${filled.map(([role, name]) => `
      <div class="shift-row">
        <div class="shift-role">${escapeHtml(role)}</div>
        <div class="shift-status">${escapeHtml(name)}</div>
      </div>
    `).join("")}
  `;

  const weather = await getVenueWeather();
  const weatherEl = document.getElementById("todayWeather");
  if (weatherEl) {
    weatherEl.textContent = weather ? `${weather.name}: ${weather.temp}°${weather.unit} — ${weather.forecast}` : "Weather unavailable right now.";
  }
}

function renderProfileEditor(profile) {
  const inner = document.getElementById("innerRoot");
  const skills = profile.skills || [];
  inner.innerHTML = `
    <div class="photo-upload-box" id="photoBox">
      ${profile.photoData ? `<img src="${profile.photoData}" />` : `<div class="photo-upload-hint">Tap to add a photo</div>`}
    </div>
    <input type="file" accept="image/*" id="photoInput" style="display:none" />

    <div class="field-block">
      <div class="label">Legal Name</div>
      <input id="legalName" placeholder="Your full name" value="${escapeAttr(profile.legalName || "")}" />
    </div>
    <div class="field-block">
      <div class="label">Crew Handle (optional nickname)</div>
      <input id="crewHandle" placeholder="What people call you" value="${escapeAttr(profile.crewHandle || "")}" />
    </div>
    <div class="field-block">
      <div class="label">What I Bring</div>
      <textarea id="bio" rows="3" placeholder="Tell us what you bring to the room">${escapeHtml(profile.bio || "")}</textarea>
    </div>
    <div class="field-block">
      <div class="label">Skills / Departments</div>
      <div class="skills-grid" id="skillsGrid">
        ${SKILLS.map((s) => `<div class="skill-chip ${skills.includes(s) ? "selected" : ""}" data-skill="${s}">${s}</div>`).join("")}
      </div>
    </div>
    <div class="field-block">
      <div class="label">Phone (internal only, not shown on ID card)</div>
      <input id="phone" type="tel" placeholder="(xxx) xxx-xxxx" value="${escapeAttr(profile.phone || "")}" />
    </div>
    <div class="field-block">
      <div class="label">Emergency Contact Name (admin-only, safety use)</div>
      <input id="emergencyName" placeholder="Who to contact if something goes wrong" value="${escapeAttr(profile.emergencyName || "")}" />
    </div>
    <div class="field-block">
      <div class="label">Emergency Contact Phone</div>
      <input id="emergencyPhone" type="tel" placeholder="(xxx) xxx-xxxx" value="${escapeAttr(profile.emergencyPhone || "")}" />
    </div>
    <button class="primary-btn" id="saveProfileBtn">Save Profile</button>
    <div id="saveMsg"></div>
  `;

  let pendingPhotoData = profile.photoData || null;
  let selectedSkills = new Set(skills);

  document.getElementById("photoBox").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("photoInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const size = 500;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        pendingPhotoData = canvas.toDataURL("image/jpeg", 0.82);
        document.getElementById("photoBox").innerHTML = `<img src="${pendingPhotoData}" />`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.querySelectorAll(".skill-chip").forEach((chip) => {
    chip.onclick = () => {
      const s = chip.dataset.skill;
      if (selectedSkills.has(s)) selectedSkills.delete(s); else selectedSkills.add(s);
      chip.classList.toggle("selected");
    };
  });

  document.getElementById("saveProfileBtn").onclick = async () => {
    const legalName = document.getElementById("legalName").value.trim();
    const crewHandle = document.getElementById("crewHandle").value.trim();
    const bio = document.getElementById("bio").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const emergencyName = document.getElementById("emergencyName").value.trim();
    const emergencyPhone = document.getElementById("emergencyPhone").value.trim();
    const msgEl = document.getElementById("saveMsg");

    if (!legalName) {
      msgEl.innerHTML = `<div class="error-msg">Legal name is required.</div>`;
      return;
    }

    const fullProfile = {
      legalName, crewHandle, bio, phone, emergencyName, emergencyPhone,
      skills: Array.from(selectedSkills),
      photoData: pendingPhotoData || null,
      updatedAt: new Date().toISOString(),
    };
    const publicProfile = {
      legalName, crewHandle,
      skills: Array.from(selectedSkills),
      photoData: pendingPhotoData || null,
      updatedAt: new Date().toISOString(),
    };

    try {
      await db.ref(`profiles/${currentUser.uid}`).set(fullProfile);
      await db.ref(`publicProfiles/${currentUser.uid}`).set(publicProfile);
      msgEl.innerHTML = `<div class="save-confirm">✓ Profile saved</div>`;
    } catch (e) {
      console.error(e);
      msgEl.innerHTML = `<div class="error-msg">Couldn't save (${escapeHtml(e.message || "unknown error")}). Make sure the database rules from the setup comment are published.</div>`;
    }
  };
}

// ============================================================================
// ID Card
// ============================================================================
// ============================================================================
// AISD has no fixed season schedule. Every event on the board comes from an
// approved labor request (see Admin > Labor Requests), stored in Firebase
// under "clientEvents". These stubs stay so shared code that references them
// keeps working.
// ============================================================================
const GAMES = [];
const ROSTER_DATA = {};

function normalizeName(s) {
  return (s || "").toLowerCase().replace(/[.,]/g, "").replace(/\s+/g, " ").trim();
}

// A roster entry can be written a few ways: a bare first name ("Dustin"),
// a first name plus last initial ("Dustin B"), a full name ("Larry
// Harless"), a nickname in parens ("Frederick (Fred)"), or someone's crew
// handle. Pull out every form worth trying to match against.
function rosterAliases(rosterName) {
  const raw = (rosterName || "").trim();
  if (!raw) return [];
  const aliases = [];
  const parenMatch = raw.match(/^(.*?)\s*\((.*?)\)\s*$/);
  if (parenMatch) {
    aliases.push(normalizeName(parenMatch[1]));
    aliases.push(normalizeName(parenMatch[2]));
  } else {
    aliases.push(normalizeName(raw));
  }
  return aliases.filter(Boolean);
}

// Match a roster entry to a specific person. Deliberately strict: a bare
// first name matches only on first name, and "First L" requires the last
// initial to line up — so two people sharing a first name no longer get
// access to each other's shifts. Crew handle wins outright when set.
//
// IMPORTANT: if two crew members share a first name, write the roster entry
// as "Dustin B" / "Dustin S" (or use their crew handles). A bare shared
// first name can't be told apart by any amount of code.
function namesMatch(rosterName, legalName, crewHandle) {
  const aliases = rosterAliases(rosterName);
  if (!aliases.length) return false;

  const handle = normalizeName(crewHandle);
  if (handle && aliases.includes(handle)) return true;

  const legal = normalizeName(legalName);
  if (!legal) return false;
  if (aliases.includes(legal)) return true;

  const legalParts = legal.split(" ").filter(Boolean);
  const first = legalParts[0];
  const last = legalParts.length > 1 ? legalParts[legalParts.length - 1] : "";
  if (!first) return false;

  return aliases.some((alias) => {
    const parts = alias.split(" ").filter(Boolean);
    if (parts.length === 1) {
      // Bare first name (or nickname). Ambiguous if two people share it —
      // that's what the last-initial convention above is for.
      return parts[0] === first;
    }
    if (parts.length >= 2) {
      const aFirst = parts[0];
      const aLast = parts[parts.length - 1];
      if (aFirst !== first) return false;
      if (!last) return false;
      if (aLast === last) return true;
      // "Dustin B" style — single-letter last initial.
      if (aLast.length === 1) return last.startsWith(aLast);
      return false;
    }
    return false;
  });
}

function findScheduledEvent(legalName, crewHandle) {
  const todayId = new Date().toISOString().slice(0, 10);
  const positions = ROSTER_DATA[todayId];
  if (!positions) return null;
  for (const [pos, name] of Object.entries(positions)) {
    if (name && name !== "TBD" && namesMatch(name, legalName, crewHandle)) {
      const game = GAMES.find((g) => g.id === todayId);
      return { position: pos, game };
    }
  }
  return null;
}

function renderIdCard(profile) {
  const inner = document.getElementById("innerRoot");
  if (!profile.legalName) {
    inner.innerHTML = `<div class="footnote">Fill out your Profile tab first — your ID card builds from that.</div>`;
    return;
  }
  const scheduled = findScheduledEvent(profile.legalName, profile.crewHandle);

  inner.innerHTML = `
    <div class="id-card ${scheduled ? "" : "id-card-unauthorized"}">
      ${scheduled ? "" : `<div class="id-card-watermark">NOT SCHEDULED TODAY</div>`}
      <div class="id-card-header">
        <img src="${ADV_LOGO}" class="id-card-adv-logo" />
        <div class="id-card-crew-label">ADV MEDIA CREW</div>
      </div>
      <div class="id-card-photo">
        ${profile.photoData ? `<img src="${profile.photoData}" />` : ""}
      </div>
      <div class="id-card-name">${escapeHtml(profile.legalName)}</div>
      <div class="id-card-title ${scheduled ? "" : "inactive"}">
        ${scheduled ? escapeHtml(scheduled.position) : "Not Scheduled Today"}
      </div>
      <div class="id-card-footer">
        <img src="${CISD_LOGO}" class="id-card-cisd-logo" />
      </div>
    </div>
  `;
}

// ============================================================================
// Helpers
// ============================================================================
function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function escapeAttr(str) { return escapeHtml(str); }

// Registered unconditionally (not gated behind the notifications button)
// so the browser recognizes this as an installable PWA from the first
// visit. Safe to call again later when notifications are enabled —
// registering twice just returns the existing registration.
// No service worker in this repo — PWA install lives on the main
// ADV Media Teams site, not here.

initFirebaseAndBoot();
</script>
