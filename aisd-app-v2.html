<!--
  ============================================================================
  SETUP — read this before handing the app out
  ============================================================================
  This uses the SAME Firebase project as broadcast-checklist.html and
  time-clock.html (crowley-football), so no new project is needed. Two things
  do need to be turned on in that project, one time:

  1. AUTHENTICATION (real Google sign-in, so login is secure and nobody
     has to remember another password):
     - In the Firebase console, left sidebar: Build > Authentication
     - Click "Get started"
     - Click "Google" in the sign-in providers list, toggle it on, pick a
       support email (your own is fine), Save.
     - Then go to Authentication > Settings > Authorized domains, and make
       sure the domain this page is hosted on (e.g. yourusername.github.io)
       is in that list. Add it if it's missing.
     That's it — contractors just tap "Sign in with Google" and use their
     existing Google account.

  2. DATABASE RULES (so profile data is actually protected):
     - Build > Realtime Database > Rules tab
     - Replace the existing rules with:

     {
       "rules": {
         "profiles": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')",
           "$uid": {
             ".read": "auth != null && auth.uid === $uid",
             ".write": "auth != null && auth.uid === $uid"
           }
         },
         "publicProfiles": {
           "$uid": {
             ".read": true,
             ".write": "auth != null && auth.uid === $uid"
           }
         },
         "checklists": { ".read": true, ".write": true },
         "help": { ".read": true, ".write": true },
         "clock": { ".read": true, ".write": true },
         "invoices": { ".read": true, ".write": true },
         "liveRoster": { ".read": true, ".write": true },
         "shiftLog": { ".read": true, ".write": true },
         "clockLocations": {
           ".write": true,
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
         },
         "clockArchive": {
           ".write": true,
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
         },
         "invoiceArchive": {
           ".write": true,
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
         },
         "approvedUsers": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')",
           "$uid": {
             ".read": "auth != null && auth.uid === $uid",
             ".write": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
           }
         },
         "pendingApprovals": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')",
           "$uid": {
             ".read": "auth != null && auth.uid === $uid",
             ".write": "auth != null && (auth.uid === $uid || auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
           }
         },
         "qbApprovals": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')",
           ".write": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
         },
         "confirmations": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')"
         },
         "equipmentReports": {
           ".read": "auth != null && (auth.token.email === 'dustin12342986@gmail.com' || auth.token.email === 'aracely.valencia10@gmail.com')",
           ".write": "auth != null"
         },
         "pushSubscriptions": {
           "$uid": {
             ".write": "auth != null && auth.uid === $uid"
           }
         }
       }
     }

     The added line at the top of "profiles" is what lets Dustin and
     Aracely's accounts specifically see everyone's full profile (photo,
     bio, phone, skills) on the new "Crew" tab — nobody else can, and
     contractors still only ever see their own via the $uid rule below it.

     This keeps the existing Clock/Checklist/Invoice data open like before
     (no login needed for those), but locks each contractor's full profile
     (including phone/contact info) so only that contractor can read or
     write it. "publicProfiles" is a smaller, non-sensitive copy (name,
     handle, departments, photo) kept in case it's useful later — the app
     doesn't currently expose it anywhere on its own.
  ============================================================================
-->

</script>

<style>
  :root {
    --bg: #0A0D12;
    --panel: #12181F;
    --panel2: #1A222B;
    --border: #26313D;
    --text: #EDEFF3;
    --text-muted: #8A96A3;
    --text-faint: #5C6774;
    --green: #33A870;
    --amber: #E0A63C;
    --red: #D65A4E;
    --blue: #4A8FC0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-weight: 700; letter-spacing: 1px; margin: 0; }
  .brand-logo { height: 40px; width: auto; flex-shrink: 0; }
  .subhead { color: var(--text-muted); font-size: 13px; margin: 2px 0 20px; }
  .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .setup-warning {
    background: #3A1A17; border: 1px solid var(--red); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 12.5px; color: #FFB3AC; display: none;
  }
  .nav-links { display: flex; gap: 8px; margin-bottom: 18px; }
  .nav-link-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 0; border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-muted); text-decoration: none;
  }
  /* Wrapper exists so we can lay a fade over the right edge — iOS hides
     scrollbars entirely, so without this there's no visual cue that tabs
     continue past the edge of a narrow screen. */
  .tabs-wrap { position: relative; }
  .tabs-wrap::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 18px; width: 28px;
    pointer-events: none; border-radius: 0 12px 12px 0;
    background: linear-gradient(to right, rgba(18,24,31,0), var(--panel));
  }
  .tabs {
    display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px; margin-bottom: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .admin-menu-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin: -8px 0 18px;
  }
  .admin-menu-group { margin-bottom: 12px; }
  .admin-menu-group:last-child { margin-bottom: 0; }
  .admin-menu-group-label {
    font-size: 10.5px; font-weight: 800; color: var(--text-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .admin-menu-group-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .admin-menu-item {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text-muted); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .admin-menu-item.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tab-btn {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: 9px; border: none; cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--text-muted); font-weight: 700; font-size: 13px;
  }
  .tab-btn.active { background: var(--blue); color: #fff; }
  .label {
    font-size: 11px; font-weight: 700; color: var(--text-faint); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 6px;
  }
  .field-block { margin-bottom: 14px; }
  select, input, textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-size: 14px; font-weight: 600; font-family: inherit;
  }
  textarea { font-weight: 400; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .auth-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-toggle-btn {
    flex: 1; padding: 9px 0; border-radius: 10px; font-weight: 700; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text-muted); cursor: pointer;
  }
  .auth-toggle-btn.active { border-color: var(--blue); background: #1B2A38; color: #8FC6F0; }
  .primary-btn {
    width: 100%; padding: 14px 0; border-radius: 12px; font-weight: 800; font-size: 15px;
    border: none; cursor: pointer; color: #fff; background: var(--blue); margin-top: 4px;
  }
  .primary-btn:disabled { background: var(--border); color: var(--text-faint); cursor: not-allowed; }
  .error-msg { color: #FF8478; font-size: 12.5px; margin-top: 8px; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; float: right;
  }
  .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-chip {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text-muted); font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .skill-chip.selected { border-color: var(--blue); background: #1B2A38; color: #8FC6F0; }
  .photo-upload-box {
    width: 100%; aspect-ratio: 1; border-radius: 14px; border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;
    background: var(--panel2); margin-bottom: 14px; max-width: 220px;
  }
  .photo-upload-box img { width: 100%; height: 100%; object-fit: cover; }
  .photo-upload-hint { color: var(--text-faint); font-size: 12px; text-align: center; padding: 20px; }
  .save-confirm {
    background: #12271D; border: 1px solid var(--green); color: #7FE0AC; border-radius: 12px;
    padding: 12px 14px; margin-top: 14px; font-size: 13px; font-weight: 700; text-align: center;
  }
  /* ID Card */
  .id-card {
    background: #fff; color: #000; border-radius: 18px; padding: 22px; max-width: 360px;
    margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
  }
  .id-card-unauthorized { box-shadow: 0 10px 30px rgba(214,90,78,0.5), 0 0 0 3px var(--red); }
  .id-card-watermark {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-28deg);
    font-size: 30px; font-weight: 900; letter-spacing: 2px; color: rgba(214,90,78,0.35);
    white-space: nowrap; pointer-events: none; z-index: 1; text-transform: uppercase;
  }
  .id-card-photo {
    width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #111;
    margin-bottom: 14px; display: flex; align-items: center; justify-content: center;
  }
  .id-card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .id-card-name { font-size: 20px; font-weight: 900; letter-spacing: 0.2px; }
  .id-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .id-card-adv-logo { width: 34px; height: 34px; object-fit: contain; }
  .id-card-crew-label { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #000; }
  .id-card-title {
    background: #000; color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 13px;
    font-weight: 800; margin-bottom: 16px; text-align: center;
  }
  .id-card-title.inactive { background: var(--red); color: #fff; font-size: 12px; }
  .id-card-footer { text-align: center; border-top: 1px solid #ddd; padding-top: 14px; }
  .id-card-cisd-logo { width: 110px; object-fit: contain; }
  .footnote { font-size: 11px; color: var(--text-faint); margin-top: 10px; font-family: monospace; }
  .admin-crew-card {
    display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .admin-crew-photo { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--panel2); }
  .admin-crew-photo img { width: 100%; height: 100%; object-fit: cover; }
  .admin-crew-photo-placeholder { width: 100%; height: 100%; background: var(--panel2); }
  .admin-crew-name { font-size: 15px; font-weight: 800; }
  .admin-crew-handle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .admin-crew-skills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .admin-skill-tag {
    background: var(--panel2); color: var(--text-muted); font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 4px;
  }
  .admin-crew-bio { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
  .admin-crew-phone { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }

  .shift-game-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .shift-game-header { font-weight: 800; font-size: 13.5px; margin-bottom: 8px; }
  .shift-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .shift-row:first-of-type { border-top: none; }
  .shift-role { flex: 0 0 90px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .shift-status { flex: 1; font-size: 13px; font-weight: 600; }
  .shift-status.shift-open { color: var(--amber); }
  .shift-action { flex: 0 0 auto; }
  .shift-btn {
    border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 800;
    cursor: pointer; color: #fff;
  }
  .shift-btn-pickup { background: var(--green); }
  .shift-btn-drop { background: var(--red); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; max-width: 400px; width: 100%;
  }
  .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .modal-subtitle { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }
  .reason-option {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 14px;
    border-top: 1px solid var(--border); cursor: pointer;
  }
  .reason-option:first-of-type { border-top: none; }
  .reason-option input { width: 18px; height: 18px; }

  .log-entry {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .log-entry-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .log-badge {
    font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 3px 9px; border-radius: 20px; color: #fff;
  }
  .log-badge-drop { background: var(--red); }
  .log-badge-pickup { background: var(--green); }
  .log-when { font-size: 11px; color: var(--text-faint); font-family: monospace; }
  .log-entry-body { font-size: 13px; line-height: 1.4; }
  .log-reason { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
</style>
</head>

<script>
// ============================================================================
// Skills / departments
// ============================================================================
const SKILLS = ["Audio", "Video", "Camera", "Lighting", "Stage", "Graphics", "Directing", "Producing", "Replay", "Utility"];

// ============================================================================
// Firebase init
// ============================================================================
let auth = null;
let db = null;
let dbReady = false;
let currentUser = null;

function showSetupWarning(message) {
  const el = document.getElementById("setupWarning");
  if (message) el.innerHTML = message;
  el.style.display = "block";
}

async function initFirebaseAndBoot() {
  try {
    if (typeof firebase === "undefined") {
      showSetupWarning("⚠️ The embedded Firebase library didn't load correctly. Try reloading the page.");
      renderAuthScreen();
      return;
    }
    if (FIREBASE_CONFIG.apiKey.startsWith("PASTE_")) {
      showSetupWarning("⚠️ This file still has placeholder Firebase values. Use the same FIREBASE_CONFIG as broadcast-checklist.html.");
      renderAuthScreen();
      return;
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.database();
    dbReady = true;

    let resolved = false;
    const authTimeout = setTimeout(() => {
      if (resolved) return;
      resolved = true;
      console.warn("Auth state check timed out — showing the login screen anyway.");
      showSetupWarning("⚠️ Taking longer than expected to check login status. If this page was opened from a downloads/share screen instead of a normal browser tab, try opening it directly in the browser instead. You can still log in below.");
      renderAuthScreen();
    }, 4000);

    auth.onAuthStateChanged(
      (user) => {
        resolved = true;
        clearTimeout(authTimeout);
        currentUser = user;
        if (user) checkApprovalAndBoot(user);
        else renderAuthScreen();
      },
      (err) => {
        resolved = true;
        clearTimeout(authTimeout);
        console.error("Auth state error:", err);
        showSetupWarning("⚠️ Couldn't check login status (" + (err && err.message ? err.message : "unknown error") + "). You can still try logging in below.");
        renderAuthScreen();
      }
    );
  } catch (e) {
    console.error(e);
    showSetupWarning("⚠️ Couldn't connect (" + (e && e.message ? e.message : "unknown error") + "). Make sure Google sign-in is turned on for this Firebase project (see setup comment at the top of this file).");
    renderAuthScreen();
  }
}

// ============================================================================
// Auth screen
// ============================================================================
let gsiInitialized = false;

function handleGoogleCredential(response) {
  const errEl = document.getElementById("authError");
  if (errEl) errEl.innerHTML = `<div class="footnote">Signing in…</div>`;
  try {
    const idToken = response.credential;
    const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
    auth.signInWithCredential(credential).catch((e) => {
      if (errEl) errEl.innerHTML = `<div class="error-msg">${escapeHtml(e && e.message ? e.message : "Something went wrong signing in.")}</div>`;
    });
    // onAuthStateChanged picks up the result from here.
  } catch (e) {
    if (errEl) errEl.innerHTML = `<div class="error-msg">${escapeHtml(e && e.message ? e.message : "Something went wrong.")}</div>`;
  }
}

function renderAuthScreen() {
  const root = document.getElementById("viewRoot");
  root.innerHTML = `
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:16px; color:var(--text-muted); font-size:13px;">
        Sign in with your Google account to access your crew profile and ID card.
      </div>
      <div id="gsiButtonContainer" style="display:flex; justify-content:center;"></div>
      <div id="authError"></div>
    </div>
  `;

  if (typeof google === "undefined" || !google.accounts || !google.accounts.id) {
    document.getElementById("authError").innerHTML = `<div class="error-msg">Google's sign-in library hasn't loaded yet. Try reloading the page in a moment.</div>`;
    return;
  }

  if (!gsiInitialized) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      auto_select: false,
    });
    gsiInitialized = true;
  }

  google.accounts.id.renderButton(
    document.getElementById("gsiButtonContainer"),
    { theme: "filled_white", size: "large", text: "signin_with", shape: "pill", width: 260 }
  );
}

// ============================================================================
// Main app (Profile / ID Card)
// ============================================================================
const mainState = { view: "today", adminMenuOpen: false };
let unsubProfile = null;

const ADMIN_EMAILS = ["dustin12342986@gmail.com", "aracely.valencia10@gmail.com"];
// ============================================================================
// Push notifications — optional, off by default. When someone taps "Enable
// Notifications," this registers a service worker and subscribes their
// browser to receive pushes (e.g. "you've been approved," "a shift opened
// up"), saving the subscription so the backend can send to it later.
// ============================================================================
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

async function wireUpNotifButton() {
  const btn = document.getElementById("notifBtn");
  if (!btn) return;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    btn.style.display = "none";
    return;
  }

  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const existingSub = reg ? await reg.pushManager.getSubscription() : null;
    btn.textContent = existingSub ? "🔔 Notifications On" : "🔔 Notifications";
  } catch (e) { /* leave default label */ }

  btn.onclick = async () => {
    btn.disabled = true;
    try {
      // Push notifications are set up on the main ADV Media Teams site,
      // which is where sw.js lives. Point at it rather than 404 here.
      const reg = await navigator.serviceWorker.register(
        "https://dustin12342986-hue.github.io/ADV-Media-Broadcast-Checklist/sw.js",
        { scope: "https://dustin12342986-hue.github.io/ADV-Media-Broadcast-Checklist/" }
      );
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        alert("Notifications weren't allowed — you can turn this on later from your browser's site settings.");
        btn.disabled = false;
        return;
      }
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
      await db.ref(`pushSubscriptions/${currentUser.uid}`).set(sub.toJSON());
      btn.textContent = "🔔 Notifications On";

      console.error("Push subscribe failed:", e);

function isAdmin() {
  return currentUser && currentUser.email && ADMIN_EMAILS.includes(currentUser.email.toLowerCase());
}

// ============================================================================
// Approval gate — new sign-ins can't reach the portals until Dustin or
// Aracely approves them. Admin accounts are auto-approved so they're never
// locked out of their own app.
// ============================================================================
async function checkApprovalAndBoot(user) {
  const root = document.getElementById("viewRoot");
  root.innerHTML = `<div class="footnote">Checking your access…</div>`;

  if (isAdmin()) {
    try {
      await db.ref(`approvedUsers/${user.uid}`).set(true);
    } catch (e) { /* non-fatal — admins still get in via isAdmin() checks elsewhere */ }
    renderMainApp();
    return;
  }

  try {
    const snap = await db.ref(`approvedUsers/${user.uid}`).once("value");
    if (snap.val() === true) {
      renderMainApp();
      return;
    }
  } catch (e) {
    console.error("Couldn't check approval status:", e);
  }

  // Not approved yet — register (or re-confirm) a pending request, then show
  // the waiting screen instead of any portal content.
  try {
    await db.ref(`pendingApprovals/${user.uid}`).set({
      email: user.email || "",
      displayName: user.displayName || "",
      requestedAt: new Date().toISOString(),
    });
  } catch (e) {
    console.error("Couldn't register pending approval:", e);
  }
  renderPendingApproval();
}

async function renderMyInvoices() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading your invoices…</div>`;

  let myProfile = {};
  try {
    const profSnap = await db.ref(`profiles/${currentUser.uid}`).once("value");
    myProfile = profSnap.val() || {};
  } catch (e) { /* fall through, handled below */ }

  if (!myProfile.legalName) {
    inner.innerHTML = `<div class="footnote">Fill out your Profile tab first — invoices are matched to your legal name.</div>`;
    return;
  }

  try {
    const snap = await db.ref("invoices").once("value");
    const byGame = snap.val() || {};
    const entries = [];
    for (const [gameId, pushes] of Object.entries(byGame)) {
      for (const [key, inv] of Object.entries(pushes)) {
        if (inv.name && namesMatch(inv.name, myProfile.legalName, myProfile.crewHandle)) {
          entries.push(Object.assign({ gameId, key }, inv));
        }
      }
    }
    entries.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    if (entries.length === 0) {
      inner.innerHTML = `<div class="footnote">No invoices found under "${escapeHtml(myProfile.legalName)}" yet.</div>`;
      return;
    }

    inner.innerHTML = `
      <div class="footnote" style="margin-bottom:12px;">Showing invoices matching "${escapeHtml(myProfile.legalName)}". Deleting one removes it from your view only — the office keeps a permanent copy regardless.</div>
      ${entries.map((inv) => {
        const game = GAMES.find((g) => g.id === inv.gameId);
        const gameLabel = game ? `${game.day} ${game.date} — ${game.opp}` : inv.gameId;
        const when = new Date(inv.submittedAt);
        const whenStr = isNaN(when) ? "" : when.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        return `
          <div class="log-entry">
            <div class="log-entry-top">
              <span class="log-badge log-badge-pickup">${inv.total ? "$" + Number(inv.total).toFixed(2) : (inv.hours ? inv.hours + " hrs" : "—")}</span>
              <span class="log-when">${whenStr}</span>
            </div>
            <div class="log-entry-body">${escapeHtml(inv.position || "")} — ${escapeHtml(gameLabel)}</div>
            ${inv.notes ? `<div class="log-reason">${escapeHtml(inv.notes)}</div>` : ""}
            <button class="shift-btn shift-btn-drop" style="margin-top:8px;" data-game="${inv.gameId}" data-key="${inv.key}">Delete</button>
          </div>
        `;
      }).join("")}
    `;

    inner.querySelectorAll(".shift-btn-drop").forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm("Delete this invoice from your view? This can't be undone, but the office keeps a permanent copy either way.")) return;
        btn.disabled = true;
        btn.textContent = "Deleting…";
        try {
          await db.ref(`invoices/${btn.dataset.game}/${btn.dataset.key}`).remove();
          renderMyInvoices();
        } catch (e) {
          alert("Couldn't delete: " + (e.message || "unknown error"));
          btn.disabled = false;
          btn.textContent = "Delete";
        }
      };
    });
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't load your invoices (${escapeHtml(e.message || "unknown error")}).</div>`;
  }
}

// ============================================================================
// Admin: Clock-In Locations (Dustin & Aracely only)
// ============================================================================
// ============================================================================
// Admin: Reset (Dustin & Aracely only) — clear the live clock-in list per
// game. The permanent clockArchive is never touched by this, no matter what.
// ============================================================================
// ============================================================================
// Admin: Approvals (Dustin & Aracely only) — approve new sign-ins, and
// revoke access from anyone previously approved.
// ============================================================================
// ============================================================================
// Admin: QB Invoice Approval (Dustin & Aracely only) — mark an invoice ready
// for QuickBooks payment. Sends an email to invoices.advmedia@gmail.com
// (the same inbox already used for invoice submissions) so whoever processes
// QuickBooks payments knows this one is cleared to pay. Approval status is
// tracked separately from the permanent invoiceArchive record, which never
// gets edited by this or anything else.
// ============================================================================
async function renderQbApproval() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading…</div>`;
  try {
    const [archiveSnap, qbSnap] = await Promise.all([
      db.ref("invoiceArchive").once("value"),
      db.ref("qbApprovals").once("value"),
    ]);
    const byGame = archiveSnap.val() || {};
    const qbApproved = qbSnap.val() || {};

    const entries = [];
    for (const [gameId, pushes] of Object.entries(byGame)) {
      for (const [key, inv] of Object.entries(pushes)) {
        entries.push(Object.assign({ gameId, key, qb: (qbApproved[gameId] || {})[key] || null }, inv));
      }
    }
    entries.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    const pending = entries.filter((e) => !e.qb);
    const approved = entries.filter((e) => e.qb);

    const renderRow = (inv) => {
      const game = GAMES.find((g) => g.id === inv.gameId);
      const gameLabel = game ? `${game.day} ${game.date} — ${game.opp}` : inv.gameId;
      const amountStr = inv.total ? "$" + Number(inv.total).toFixed(2) : (inv.hours ? inv.hours + " hrs" : "—");
      const when = new Date(inv.submittedAt);
      const whenStr = isNaN(when) ? "" : when.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      return `
        <div class="log-entry">
          <div class="log-entry-top">
            <span class="log-badge log-badge-pickup">${amountStr}</span>
            <span class="log-when">${whenStr}</span>
          </div>
          <div class="log-entry-body">
            <strong>${escapeHtml(inv.name || "Unknown")}</strong> · ${escapeHtml(inv.position || "")} — ${escapeHtml(gameLabel)}
          </div>
          ${inv.notes ? `<div class="log-reason">${escapeHtml(inv.notes)}</div>` : ""}
          ${inv.qb
            ? `<div class="log-reason" style="color:${inv.qb.quickbooksBillCreated ? "var(--green)" : "var(--amber)"};">${inv.qb.quickbooksBillCreated ? `✓ QuickBooks Bill #${inv.qb.quickbooksBillId} created automatically` : "⚠ Approved, but needs manual entry in QuickBooks (see email)"} — by ${escapeHtml(inv.qb.approvedByName || inv.qb.approvedByEmail || "")}, ${new Date(inv.qb.approvedAt).toLocaleDateString()}</div>`
            : `<button class="shift-btn shift-btn-pickup" style="margin-top:8px;" data-game="${inv.gameId}" data-key="${inv.key}" data-name="${escapeAttr(inv.name || "")}" data-position="${escapeAttr(inv.position || "")}" data-amount="${escapeAttr(amountStr)}" data-rawtotal="${inv.total || ""}" data-gamelabel="${escapeAttr(gameLabel)}">Approve for QuickBooks</button>`}
        </div>
      `;
    };

    inner.innerHTML = `
      <div class="footnote" style="margin-bottom:12px;">Approving here creates a real Bill in QuickBooks against the matching Vendor, and always emails ${INVOICE_RECIPIENT} too as a backup — so this gets paid within your normal window even if the QuickBooks step ever fails. This is separate from the permanent invoice record, which never changes.</div>
      <div class="section-heading" style="font-size:12px; font-weight:800; color:var(--amber); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;">Awaiting QB approval (${pending.length})</div>
      ${pending.length === 0 ? `<div class="footnote" style="margin-bottom:16px;">Nothing waiting right now.</div>` : pending.map(renderRow).join("")}
      <div class="section-heading" style="font-size:12px; font-weight:800; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin:18px 0 8px;">Already sent to QuickBooks (${approved.length})</div>
      ${approved.length === 0 ? `<div class="footnote">Nothing sent yet.</div>` : approved.map(renderRow).join("")}
    `;

    inner.querySelectorAll(".shift-btn-pickup[data-game]").forEach((btn) => {
      btn.onclick = async () => {
        const { game: gameId, key, name, position, amount, rawtotal, gamelabel } = btn.dataset;
        if (!confirm(`Approve this invoice for QuickBooks payment? This creates a real Bill in QuickBooks against the matching Vendor.`)) return;
        btn.disabled = true;
        btn.textContent = "Approving…";

        const approverName = (currentUser.displayName || currentUser.email || "Admin");
        let qbResult = null;
        let qbError = null;

        // Try creating the actual Bill in QuickBooks first.
        if (rawtotal) {
          try {
            const idToken = await currentUser.getIdToken();
            const res = await fetch(
              "https://us-central1-crowley-football.cloudfunctions.net/approveQbInvoice",
              {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
                body: JSON.stringify({ data: { vendorName: name, amount: rawtotal, memo: `${position} — ${gamelabel}` } }),
              }
            );
            const body = await res.json();
            if (res.ok && body.result && body.result.success) {
              qbResult = body.result;
            } else {
              qbError = (body.error && body.error.message) || "Unknown error creating the QuickBooks Bill.";
            }
          } catch (e) {
            qbError = e.message || "Couldn't reach the QuickBooks connection.";
          }
        } else {
          qbError = "No dollar total on this invoice — can't create a QuickBooks Bill from hours alone.";
        }

        // Always send the email too — a guaranteed backup so the office
        // still knows to pay this within the 30-day window even if the
        // QuickBooks API step above failed for any reason.
        let emailOk = false;
        try {
          const res = await fetch(FORMSPREE_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              _subject: `QB Payment Ready: ${name} (${position}) — ${amount}`,
              name, position, amount, game: gamelabel,
              approvedBy: approverName,
              quickbooksStatus: qbResult ? `Bill #${qbResult.billId} created automatically` : `NOT created automatically — ${qbError}`,
              message: `${approverName} approved this invoice for QuickBooks payment. Name: ${name}, Position: ${position}, Game: ${gamelabel}, Amount: ${amount}. ${qbResult ? "A QuickBooks Bill was created automatically." : "The automatic QuickBooks step failed (" + qbError + ") — please enter this payment manually."}`,
            }),
          });
          emailOk = res.ok;
        } catch (e) {
          console.error("QB approval email failed:", e);
        }

        try {
          await db.ref(`qbApprovals/${gameId}/${key}`).set({
            approvedByEmail: currentUser.email || "",
            approvedByName: approverName,
            approvedAt: new Date().toISOString(),
            emailSent: emailOk,
            quickbooksBillCreated: !!qbResult,
            quickbooksBillId: qbResult ? qbResult.billId : null,
            quickbooksError: qbError,
          });
        } catch (e) {
          alert("Couldn't save approval status: " + (e.message || "unknown error"));
        }

        if (qbResult) {
          alert(`✓ Bill created in QuickBooks against ${qbResult.vendorMatched} (Bill #${qbResult.billId}).`);
        } else {
          alert("Couldn't create the QuickBooks Bill automatically (" + qbError + "). An email was still sent to " + INVOICE_RECIPIENT + " so it can be entered manually — this invoice is not lost.");
        }
        renderQbApproval();
      };
    });
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't load QB approvals (${escapeHtml(e.message || "unknown error")}). Make sure the database rules include a "qbApprovals" section — see the setup comment at the top of this file.</div>`;
  }
}

// Shift Marketplace (pick up / drop shifts)
// ============================================================================
const TRADEABLE_ROLES = ["Stagehand", "Spotlight Operator", "GAV", "A2", "L2", "V2", "Coordinator", "A1", "L1", "V1", "Engineer", "Stage Manager", "GFX", "Producer", "Director", "EIC"];
const DROP_REASONS = ["Family Emergency", "Medical Emergency", "Double Booking", "Other"];

let unsubLiveRoster = null;
let myProfileForShifts = null;

async function seedLiveRosterIfNeeded() {
  const snap = await db.ref("liveRoster").once("value");
  if (snap.exists()) return;
  const seed = {};
  for (const g of GAMES) {
    const rosterForGame = ROSTER_DATA[g.id] || {};
    seed[g.id] = {};
    for (const role of TRADEABLE_ROLES) {
      const name = rosterForGame[role];
      const key = role.replace(/[^A-Za-z0-9]/g, "_");
      if (name && name !== "TBD") {
        seed[g.id][key] = { role, name, status: "assigned" };
      } else {
        seed[g.id][key] = { role, name: null, status: "open" };
      }
    }
  }
  // update() rather than set() so this can never blow away client-event
  // slots if it were ever to run with data present.
  await db.ref("liveRoster").update(seed);
}

// AISD (and any future client) events are created from approved labor
// requests, so they live in Firebase rather than the hardcoded GAMES list.
// Loaded into here when the Shifts view opens.
let clientEvents = {};

// Every event the shift board should show: the hardcoded season schedule
// plus anything created from a client request. Each entry carries its own
// role list, since a client event only staffs the positions they asked for.
function allShiftEvents() {
  const built = GAMES.map((g) => ({ ...g, roles: TRADEABLE_ROLES, client: "CISD" }));
  Object.entries(clientEvents).forEach(([id, ev]) => {
    if (!ev) return;
    built.push({
      id,
      day: ev.day || "",
      date: ev.date || "",
      opp: ev.name || "Event",
      roles: Array.isArray(ev.roles) && ev.roles.length ? ev.roles : TRADEABLE_ROLES,
      client: ev.client || "Client",
      venue: ev.venue || "",
      callTime: ev.callTime || "",
      scheduledHours: ev.scheduledHours || null,
    });
  });
  // Soonest first.
  return built.sort((a, b) => String(a.id).localeCompare(String(b.id)));
}

async function renderShiftsView() {
  const inner = document.getElementById("innerRoot");
  inner.innerHTML = `<div class="footnote">Loading shifts…</div>`;

  try {
    await seedLiveRosterIfNeeded();
  } catch (e) {
    console.error(e);
    inner.innerHTML = `<div class="error-msg">Couldn't set up the shift board (${escapeHtml(e.message || "unknown error")}). Make sure the database rules include a "liveRoster" section — see the setup comment at the top of this file.</div>`;
    return;
  }

  try {
    const profSnap = await db.ref(`profiles/${currentUser.uid}`).once("value");
    myProfileForShifts = profSnap.val() || {};
    const evSnap = await db.ref("clientEvents").once("value");
    clientEvents = evSnap.val() || {};
  } catch (e) {
    myProfileForShifts = {};
  }

  if (unsubLiveRoster) { unsubLiveRoster(); unsubLiveRoster = null; }
  const ref = db.ref("liveRoster");
  const cb = (snap) => {
    renderShiftsList(snap.val() || {});
  };
  ref.on("value", cb);
  unsubLiveRoster = () => ref.off("value", cb);
}

function renderShiftsList(liveRoster) {
  const inner = document.getElementById("innerRoot");
  const myName = myProfileForShifts && myProfileForShifts.legalName;
  const myHandle = myProfileForShifts && myProfileForShifts.crewHandle;

  if (!myName) {
    inner.innerHTML = `<div class="footnote">Fill out your Profile tab first — shifts are matched to your legal name.</div>`;
    return;
  }

  const admin = isAdmin();
  inner.innerHTML = `
    <div class="footnote" style="margin-bottom:12px;">Pick up open shifts, or drop one you can't make. Everyone sees changes live.${admin ? " As an admin, you can also assign, reassign, or remove anyone's shift." : ""}</div>
    ${allShiftEvents().map((g) => {
      const gameRoster = liveRoster[g.id] || {};
      const rows = (g.roles || TRADEABLE_ROLES).map((role) => {
        const key = role.replace(/[^A-Za-z0-9]/g, "_");
        const entry = gameRoster[key] || { role, name: null, status: "open" };
        const isMine = entry.status === "assigned" && namesMatch(entry.name, myName, myHandle);
        let actionHtml = "";
        if (entry.status === "open") {
          actionHtml = `<button class="shift-btn shift-btn-pickup" data-game="${g.id}" data-role="${key}">Pick Up</button>`;
          if (admin) {
            actionHtml += `<button class="shift-btn shift-btn-admin-assign" data-game="${g.id}" data-role="${key}" style="margin-left:6px; background:var(--panel2); border:1px solid var(--border); color:var(--text-muted);">Assign</button>`;
          }
        } else if (isMine) {
          actionHtml = `<button class="shift-btn shift-btn-drop" data-game="${g.id}" data-role="${key}">Drop</button>`;
          if (admin) {
            actionHtml += `<button class="shift-btn shift-btn-admin-assign" data-game="${g.id}" data-role="${key}" style="margin-left:6px; background:var(--panel2); border:1px solid var(--border); color:var(--text-muted);">Reassign</button>`;
          }
        } else if (admin) {
          actionHtml = `
            <button class="shift-btn shift-btn-admin-assign" data-game="${g.id}" data-role="${key}" style="background:var(--panel2); border:1px solid var(--border); color:var(--text-muted);">Reassign</button>
            <button class="shift-btn shift-btn-admin-remove" data-game="${g.id}" data-role="${key}" style="margin-left:6px; background:var(--panel2); border:1px solid var(--red); color:var(--red);">Remove</button>
          `;
        }
        return `
          <div class="shift-row">
            <div class="shift-role">${escapeHtml(role)}</div>
            <div class="shift-status ${entry.status === "open" ? "shift-open" : ""}">${entry.status === "open" ? "Open" : escapeHtml(entry.name)}</div>
            <div class="shift-action">${actionHtml}</div>
          </div>
        `;
      }).join("");
      return `
        <div class="shift-game-card">
          <div class="shift-game-header">
            ${g.day} ${g.date} — ${escapeHtml(g.opp)}
            ${g.client && g.client !== "CISD" ? `<span style="background:var(--blue); color:#fff; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:6px; margin-left:8px; vertical-align:middle;">${escapeHtml(g.client)}</span>` : ""}
          </div>
          ${g.venue || g.callTime ? `<div class="log-reason" style="margin:-4px 0 8px;">${escapeHtml(g.venue || "")}${g.venue && g.callTime ? " · " : ""}${g.callTime ? "Call " + escapeHtml(g.callTime) : ""}</div>` : ""}
          ${rows}
        </div>
      `;
    }).join("")}
  `;

  inner.querySelectorAll(".shift-btn-pickup").forEach((btn) => {
    btn.onclick = () => pickUpShift(btn.dataset.game, btn.dataset.role);
  });
  inner.querySelectorAll(".shift-btn-drop").forEach((btn) => {
    btn.onclick = () => openDropModal(btn.dataset.game, btn.dataset.role);
  });
  inner.querySelectorAll(".shift-btn-admin-assign").forEach((btn) => {
    btn.onclick = () => openAdminAssignModal(btn.dataset.game, btn.dataset.role);
  });
  inner.querySelectorAll(".shift-btn-admin-remove").forEach((btn) => {
    btn.onclick = () => adminRemoveShift(btn.dataset.game, btn.dataset.role);
  });
}

// ============================================================================
// Admin shift controls — assign, reassign, or remove anyone's shift.
// Every action is written to the same shiftLog as crew pickups/drops, but
// tagged as an admin action with who did it, so the audit trail stays
// complete.
// ============================================================================
let adminAssignState = null;

async function openAdminAssignModal(gameId, roleKey) {
  adminAssignState = { gameId, roleKey, crew: [], loading: true, manualName: "" };
  renderAdminAssignModal();
  try {
    const snap = await db.ref("profiles").once("value");
    const profiles = snap.val() || {};
    adminAssignState.crew = Object.values(profiles)
      .filter((p) => p && p.legalName)
      .map((p) => ({ legalName: p.legalName, crewHandle: p.crewHandle || "" }))
      .sort((a, b) => a.legalName.localeCompare(b.legalName));
  } catch (e) {
    console.error("Couldn't load crew list:", e);
  }
  adminAssignState.loading = false;
  renderAdminAssignModal();
}

function renderAdminAssignModal() {
  const existing = document.getElementById("adminAssignOverlay");
  if (existing) existing.remove();
  if (!adminAssignState) return;

  const { crew, loading, roleKey, gameId } = adminAssignState;
  const game = GAMES.find((g) => g.id === gameId);
  const roleLabel = TRADEABLE_ROLES.find((r) => r.replace(/[^A-Za-z0-9]/g, "_") === roleKey) || roleKey;

  const overlay = document.createElement("div");
  overlay.id = "adminAssignOverlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-title">Assign ${escapeHtml(roleLabel)}</div>

async function adminAssignShift(gameId, roleKey, assigneeName) {
  const adminName = (myProfileForShifts && myProfileForShifts.legalName) || currentUser.displayName || currentUser.email || "Admin";
  try {

    await db.ref(`liveRoster/${gameId}/${roleKey}`).set({ role: entry.role || roleKey, name: assigneeName, status: "assigned" });
    await db.ref(`shiftLog/${gameId}`).push({
      role: entry.role || roleKey,
      action: previousName ? "reassigned by admin" : "assigned by admin",
      byName: adminName, byUid: currentUser.uid,

async function adminRemoveShift(gameId, roleKey) {
  const adminName = (myProfileForShifts && myProfileForShifts.legalName) || currentUser.displayName || currentUser.email || "Admin";
  try {
    const snap = await db.ref(`liveRoster/${gameId}/${roleKey}`).once("value");

    if (!confirm(`Remove ${entry.name} from ${entry.role || roleKey}? The shift will go back to Open for anyone to pick up.`)) return;

      role: entry.role || roleKey, action: "removed by admin",
      byName: adminName, byUid: currentUser.uid,
      reason: `Removed ${entry.name} — shift reopened`, otherText: "", at: new Date().toISOString(),
    });

    alert("Couldn't remove that shift: " + (e.message || "unknown error"));

}

async function pickUpShift(gameId, roleKey) {
  const myName = myProfileForShifts && myProfileForShifts.legalName;

      role: entry.role, action: "picked up", byName: myName,
      byUid: currentUser.uid, at: new Date().toISOString(),
    });

    alert("Couldn't pick up that shift: " + (e.message || "unknown error"));
  }
}

async function getVenueWeather() {
  try {

    const forecastUrl = pointData.properties && pointData.properties.forecast;

    const forecastRes = await fetch(forecastUrl);
    const forecastData = await forecastRes.json();
    const period = forecastData.properties && forecastData.properties.periods && forecastData.properties.periods[0];
    return period ? { name: period.name, forecast: period.detailedForecast, temp: period.temperature, unit: period.temperatureUnit } : null;
  } catch (e) {
    console.error("Weather fetch failed:", e);
    return null;
  }
}
